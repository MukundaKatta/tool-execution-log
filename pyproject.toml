[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-execution-log"
version = "0.1.0"
description = "Structured JSONL log of tool executions with per-tool latency and error stats"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["agent", "tools", "logging", "profiling", "jsonl"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
]

[tool.setuptools.packages.find]
where = ["src"]
